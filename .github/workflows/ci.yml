name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm typecheck

      - run: pnpm build

      - run: pnpm build-storybook

  # VRT runs in the official Playwright container so the rendering environment
  # is pinned by the image tag. Keep the tag in sync with the playwright
  # version in pnpm-lock.yaml. Baselines compared here are the -linux.png ones;
  # regenerate them with the "VRT Update Baselines" workflow.
  vrt:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v5

      - run: npm install -g pnpm@10.27.0

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:vrt

      - name: Upload VRT diff images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vrt-attachments
          path: .vitest/attachments/
          retention-days: 7
