# Regenerates the -linux VRT baselines inside the same Playwright container
# that CI uses, and commits them to the branch. Run after an intentional visual
# change (or when adding stories) to refresh the CI baselines.
#
# main is protected (PRs only), so dispatch this on your FEATURE BRANCH; the
# bot commit lands on that branch and rides the PR into main.
name: VRT Update Baselines

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - run: npm install -g pnpm@10.27.0

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:vrt:update

      - name: Commit updated baselines
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add __screenshots__
          if git diff --cached --quiet; then
            echo "Baselines unchanged."
          else
            git commit -m "chore: update VRT baselines (linux)"
            git push
          fi
